
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title and page.title != "Home" %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        Livi Rose<span class="logo-period">.</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/games/' | relative_url }}">Games</a>
        <a href="{{ '/software/' | relative_url }}">Helpful Programs</a>
        <a href="{{ '/experience/' | relative_url }}">Experience</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="nav-resume" href="{{ '/assets/documents/resume.pdf' | relative_url }}" target="_blank" rel="noopener">
          Résumé <span aria-hidden="true">↗</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Designed and developed by Livi Rose.</p>

      <div class="footer-links">
        <a href="https://github.com/LiviRoseGames" target="_blank" rel="noopener">GitHub ↗</a>
        <a href="https://livirosegames.itch.io/" target="_blank" rel="noopener">Itch.io ↗</a>
        <a href="mailto:">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
